<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="qy-token" content="__QY_TOKEN__">
<title>清一新教育 · 文章工作台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="app">

  <aside class="nav">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <b>文章工作台</b>
        <span id="brand-sub">清一新教育</span>
      </div>
    </div>

    <div class="nav-group">内容</div>
    <button class="nav-item active" data-view="library">
      <span>全部内容</span><em id="n-docs">0</em>
    </button>
    <button class="nav-item" data-view="articles">
      <span>专栏文章</span><em id="n-articles">0</em>
    </button>
    <button class="nav-item" data-view="answers">
      <span>知乎回答</span><em id="n-answers">0</em>
    </button>
    <button class="nav-item" data-view="pins">
      <span>知乎想法</span><em id="n-pins">0</em>
    </button>
    <button class="nav-item" data-view="questions">
      <span>知乎提问</span><em id="n-questions">0</em>
    </button>
    <button class="nav-item" data-view="blocked">
      <span>待处理</span><em id="n-blocked" class="em-danger">0</em>
    </button>
    <button class="nav-item" data-view="nobody">
      <span>缺正文</span><em id="n-nobody">0</em>
    </button>

    <div class="nav-group">输出</div>
    <button class="nav-item" data-view="export">
      <span>导出 Word</span>
    </button>
    <button class="nav-item" data-view="audit">
      <span>一致性审计</span><em id="n-audit" class="em-danger"></em>
    </button>
    <button class="nav-item" data-view="rules">
      <span>检查规则</span><em id="n-rules">0</em>
    </button>

    <div class="nav-foot">
      <div class="who" id="who">
        <span class="dot" id="conn-dot"></span>
        <span id="who-text">未登录</span>
      </div>
      <button class="link" id="btn-login" style="font-weight:600;color:var(--accent)">知乎登录认证 (免F12)</button>
      <div class="tiny" id="mode-hint"></div>
      
      <div class="who" style="margin-top:10px" id="ai-who">
        <span class="dot on" id="ai-dot"></span>
        <span id="ai-status-text" style="font-size:11.5px;color:var(--text-2)">AI 引擎已连接</span>
      </div>
      <button class="link" id="btn-ai-cfg" style="font-size:11px">配置 AI 接口</button>

      <div class="who" style="margin-top:10px" id="cloud-who">
        <span class="dot on" id="cloud-dot"></span>
        <span id="cloud-status-text" style="font-size:11.5px;color:var(--text-2)">云端已连接 · v1.1.0</span>
      </div>
      <button class="link" id="btn-check-update" style="font-size:11px">检查云端更新</button>
    </div>
  </aside>

  <section class="list">
    <div class="list-head">
      <div class="search">
        <input id="q" type="search" placeholder="搜索标题…" autocomplete="off">
      </div>
      <div class="pills" id="filters">
        <button class="pill active" data-only="">全部</button>
        <button class="pill" data-only="article">文章</button>
        <button class="pill" data-only="answer">回答</button>
        <button class="pill" data-only="pin">想法</button>
        <button class="pill" data-only="question">提问</button>
        <button class="pill" data-only="blocked">阻断</button>
        <button class="pill" data-only="dirty">待上传</button>
        <button class="pill" data-only="no_brand">无署名</button>
      </div>
      <div class="list-tools">
        <button class="mini" id="btn-inspect">同步列表</button>
        <button class="mini" id="btn-sync-body">同步正文</button>
        <label class="mini chk"><input type="checkbox" id="sel-all"> 全选</label>
      </div>
    </div>
    <div class="list-body" id="list-body">
      <div class="empty">正在载入…</div>
    </div>
    <div class="list-foot" id="list-foot">
      <div class="list-foot-top">
        <span id="sel-count">未勾选文章</span>
        <button class="mini link" id="btn-clear-sel" style="display:none;color:var(--text-3);padding:1px 6px;font-size:11px" title="清空勾选">✕ 清空</button>
      </div>
      <div class="foot-actions" id="foot-actions">
        <button class="mini primary" id="btn-check" disabled title="对勾选内容批量运行敏感词与合规检查">🔍 检查</button>
        <button class="mini" id="btn-sel-sync-body" disabled title="批量拉取并同步已勾选文章的正文">📥 正文</button>
        <button class="mini" id="btn-export" disabled title="将勾选内容批量导出为 Word 文档">📄 导出</button>
      </div>
    </div>
  </section>

  <main class="detail" id="detail">
    <div class="empty big">从左边选一篇文章</div>
  </main>

</div>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal" id="modal-box"></div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
